[workspace]
resolver = "2"
members = ["base", "bus", "cli", "harness", "sandbox", "storage", "test-support", "ui", "worker"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
arc-swap = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
git2 = { version = "0.20", default-features = false }
globset = "0.4"
ignore = "0.4"
libc = "0.2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = [
  "charset",
  "http2",
  "json",
  "rustls",
  "stream",
] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
rusqlite = { version = "0.40", features = ["blob", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
tar = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }

[profile.release]
strip = true
# Base runs no user code and supervises everything else; a panic in it is a bug,
# not a condition to unwind out of. `cargo test` uses the dev profile, so the
# test harness still unwinds.
panic = "abort"
