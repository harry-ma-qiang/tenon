[package]
name = "tenon-cli"
description = "The tenon binary: base, attach, stop, reset, status, harness and worker roles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "tenon"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
tenon-base = { path = "../base" }
tenon-harness = { path = "../harness" }
tenon-sandbox = { path = "../sandbox" }
tenon-worker = { path = "../worker" }

[features]
http = ["tenon-base/http"]

[dev-dependencies]
base64.workspace = true
sha2.workspace = true
libc.workspace = true
tenon-harness = { path = "../harness" }
